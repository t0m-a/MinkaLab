# Configuración de Cloudflare Pages / Workers para Minka Lab
# Copia este archivo a 'wrangler.toml' si utilizas la CLI de Wrangler

name = "minkalab"
pages_build_output_dir = "."
compatibility_date = "2024-01-01"

# Base de datos Cloudflare D1
[[d1_databases]]
binding = "DB"                                   # Nombre exacto del binding utilizado en el código
database_name = "minkalab-db"                    # Nombre que le des a la base de datos en Cloudflare
database_id = "a05bd725-51a4-4c5a-81f6-400e6beb9182"             # Reemplazar con el ID que genera Cloudflare

# Variables de entorno opcionales (puedes definirlas aquí o en el Dashboard de Cloudflare Pages):
# [vars]
# NOTIFY_EMAIL = "contact@minkalab.net"
# FROM_EMAIL = "notificaciones@minkalab.net"
# TELEGRAM_BOT_TOKEN = "123456789:ABCDEF..."
# TELEGRAM_CHAT_ID = "987654321"
# RESEND_API_KEY = "re_..."
