name = "minkalab"
compatibility_date = "2024-01-01"
pages_build_output_dir = "."

# Configuración de base de datos D1
# Reemplaza TU_DATABASE_ID con el ID que te dio Cloudflare al crear "minkalab-db"
# (puedes verlo en Storage & Databases > D1 SQLite Database > minkalab-db)
[[d1_databases]]
binding = "DB"
database_name = "minkalab-db"
database_id = "a05bd725-51a4-4c5a-81f6-400e6beb9182"

[assets]
directory = "./functions/api"